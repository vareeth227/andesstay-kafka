# application.yml de ms-andesstay-kafka-consumer
# src/main/resources/application.yml

server:
  port: 8085                     # puerto propio (rabbit-admin usa 8084)

spring:
  application:
    name: ms-andesstay-kafka-consumer
  kafka:
    # FUERA de Docker (en el host / EC2):
    bootstrap-servers: localhost:29092,localhost:39092,localhost:49092
    # DENTRO de la red Docker:
    # bootstrap-servers: kafka-1:9092,kafka-2:9092,kafka-3:9092
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # ErrorHandlingDeserializer envuelve al JsonDeserializer: si llega un
      # mensaje corrupto NO rompe el consumidor, lo entrega como error controlado.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      auto-offset-reset: earliest   # desde el inicio si el grupo es nuevo
      enable-auto-commit: false     # el commit lo maneja Spring tras procesar OK
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "cl.andesstay.*"
        spring.json.value.default.type: cl.andesstay.kafkaconsumer.event.ReservationKafkaEvent
    listener:
      ack-mode: record             # confirma offset despues de cada registro OK
